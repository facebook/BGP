name: Build BGP
run-name: Build BGP
on:
  # Build on every PR raised against the OSS repo
  pull_request:
  # Allow manually triggering the workflow
  workflow_dispatch:
  # Periodic daily build to catch breakages from upstream dependency drift
  # even when no PR is open.
  # ShipIt syncs hourly around HH:21, so schedule with a ~15 minute offset so
  # the run picks up the freshest sync.
  schedule:
    # Run daily at 7:36AM UTC = 12:36AM PDT
    - cron: '36 7 * * *'

# Cancel a superseded run when new commits are pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  BGP-Build:
    name: BGP-${{ matrix.variant }}
    runs-on: 32-core-ubuntu
    env:
      FBOSS_BUILD_PROFILE: ${{ matrix.fboss_profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: dc
            fboss_profile: fsdb_client
          - variant: bb
            fboss_profile: exported_libraries
    steps:
      - run: echo "Confirming hardware specifications:"; sudo lscpu
      - name: Clean workspace
        run: sudo rm -rf ${{ github.workspace }}/*
      - name: Check out repository code
        uses: actions/checkout@v7
      # Build in the FBOSS CentOS Stream 9 image through run-getdeps.py, as the
      # internal BGP OSS builds do. The wrapper switches the image to clang and
      # sets flags some dependencies need (e.g. HAVE_SETNS for iproute2); plain
      # getdeps on the Ubuntu runner has never built this dependency closure.
      # Neither the Dockerfile nor the wrapper ships in this repo, so both come
      # from an FBOSS clone.
      - name: Fetch FBOSS build tooling
        run: git clone --depth 1 https://github.com/meta/fboss.git ${{ runner.temp }}/fboss
      - name: Build FBOSS Docker image
        run: >
          sudo docker build ${{ runner.temp }}/fboss
          -f ${{ runner.temp }}/fboss/fboss/oss/docker/Dockerfile
          -t fboss_image
          --build-arg USE_CLANG=true
      # Build DC against the FBOSS fsdb_client profile and BB against the
      # smaller exported_libraries profile. Separate build directories ensure
      # each variant configures and installs its own dependency closure.
      # --num-jobs is capped below the core count because large Folly and
      # Thrift translation units can exhaust the runner's memory.
      # --scratch-path MUST live OUTSIDE the checkout: getdeps applies dependency
      # patches with `git apply` after cd-ing to the enclosing git repo root, so a
      # scratch dir nested in this repo makes it patch from the BGP root and fail
      # (e.g. boost -> "No such file or directory"). runner.temp is a sibling of
      # the checkout and is not a git repo.
      # FBOSS_ROOT points run-getdeps.py at this checkout's getdeps instead of
      # the FBOSS clone it runs from.
      - name: Build BGP ${{ matrix.variant }} (getdeps / CMake)
        run: >
          sudo docker run --rm
          --cap-add=CAP_AUDIT_WRITE
          -e FBOSS_ROOT=/var/FBOSS/fboss
          -e FBOSS_BUILD_PROFILE=${{ matrix.fboss_profile }}
          -v ${{ github.workspace }}:/var/FBOSS/fboss:z
          -v ${{ runner.temp }}/fboss:/var/FBOSS/fboss_tools:ro
          -v ${{ runner.temp }}/bgp-build-${{ matrix.variant }}:/var/FBOSS/tmp_bld_dir:z
          fboss_image:latest
          python3 /var/FBOSS/fboss_tools/fboss/oss/scripts/run-getdeps.py
          build
          --allow-system-packages
          --scratch-path /var/FBOSS/tmp_bld_dir
          --extra-cmake-defines='{"BGP_BUILD_VARIANT":"${{ matrix.variant }}"}'
          --src-dir=.
          --num-jobs 18
          bgp
      - name: Test BGP ${{ matrix.variant }} (getdeps / CTest)
        run: >
          sudo docker run --rm
          --cap-add=CAP_AUDIT_WRITE
          -e FBOSS_ROOT=/var/FBOSS/fboss
          -e FBOSS_BUILD_PROFILE=${{ matrix.fboss_profile }}
          -v ${{ github.workspace }}:/var/FBOSS/fboss:z
          -v ${{ runner.temp }}/fboss:/var/FBOSS/fboss_tools:ro
          -v ${{ runner.temp }}/bgp-build-${{ matrix.variant }}:/var/FBOSS/tmp_bld_dir:z
          fboss_image:latest
          python3 /var/FBOSS/fboss_tools/fboss/oss/scripts/run-getdeps.py
          test
          --allow-system-packages
          --scratch-path /var/FBOSS/tmp_bld_dir
          --extra-cmake-defines='{"BGP_BUILD_VARIANT":"${{ matrix.variant }}"}'
          --src-dir=.
          --num-jobs 18
          bgp
      - name: Restore build ownership
        if: always()
        run: >
          sudo chown -R runner:runner
          ${{ runner.temp }}/bgp-build-${{ matrix.variant }}
          ${{ github.workspace }}
      # Retain the build output only for non-PR runs (daily schedule + manual
      # dispatch). PRs skip artifact upload so they do not pile up artifacts.
      - name: Locate BGP install directory
        if: github.event_name != 'pull_request'
        id: instdir
        run: >
          echo "dir=$(python3 build/fbcode_builder/getdeps.py
          --scratch-path ${{ runner.temp }}/bgp-build-${{ matrix.variant }}
          show-inst-dir
          --extra-cmake-defines='{"BGP_BUILD_VARIANT":"${{ matrix.variant }}"}'
          --src-dir=. bgp)" >> "$GITHUB_OUTPUT"
      - name: Upload BGP build output
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bgp-${{ matrix.variant }}
          path: ${{ steps.instdir.outputs.dir }}
          retention-days: 14
